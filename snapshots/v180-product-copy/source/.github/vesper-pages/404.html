<!doctype html>
<!-- SPDX-License-Identifier: MIT
 @input An unknown Pages route. @output Explicit native collection recovery. @position Vesper 404; never silently redirects queries or hashes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page not found — Vesper</title>
    <style>
      body {
        font:
          16px/1.7 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        max-width: 40rem;
        margin: 15vh auto;
        padding: 24px;
        background: #f4f4f5;
        color: #18181b;
      }
      h1 {
        font-size: 32px;
        font-weight: 500;
      }
      a {
        color: #174dbb;
        outline-offset: 4px;
      }
      li {
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Vesper / 404</p>
      <h1>This page isn't here.</h1>
      <p>
        The address may have changed. Nothing has been redirected, so your query
        and fragment remain in the address bar.
      </p>
      <ul>
        <li><a id="home" href="/">Vesper home</a></li>
        <li><a id="collection" href="/#/components">Browse components</a></li>
      </ul>
    </main>
    <script>
      const base =
        location.pathname === '/vesper' ||
        location.pathname.startsWith('/vesper/')
          ? '/vesper/'
          : '/';
      document.querySelector('#home').href = base;
      document.querySelector('#collection').href =
        base +
        location.search +
        (location.hash.startsWith('#/components')
          ? location.hash
          : '#/components');
    </script>
  </body>
</html>
