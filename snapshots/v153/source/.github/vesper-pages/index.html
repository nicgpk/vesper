<!doctype html>
<!-- SPDX-License-Identifier: MIT
 @input Bundled React demos and the shared Vesper themes.
 @output Native, interactive component documentation.
 @position Vesper GitHub Pages application shell. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Explore Vesper's real components on a photographic backdrop. Try live examples, inspect the material, and copy React source without leaving the page." />
    <title>Components — Vesper</title>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="docs.css" />
    <link rel="stylesheet" href="preview.css" />
    <link rel="stylesheet" href="{{APP_CSS}}" />
    <script type="module" src="{{APP_JS}}"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript
      >This component collection needs JavaScript to render its live React
      examples. Enable JavaScript to explore Vesper.</noscript
    >
  </body>
</html>
