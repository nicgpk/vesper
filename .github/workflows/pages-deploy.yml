# Publish only the verified, compiled Vesper gallery; never the repository tree.
name: Publish Vesper demo

on:
  push:
    branches: ['vesper/baseline']
    paths:
      - 'snapshots/v163/hosted/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: vesper-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/vesper/baseline'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify publication scope
        shell: bash
        run: |
          test -f snapshots/v163/hosted/index.html
          test -d snapshots/v163/hosted/assets
          test ! -d snapshots/v163/hosted/source
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: snapshots/v163/hosted
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v5
